[project]
name = "aural_ingest"
version = "0.0.0"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
  "basic-pitch>=0.4.0",
  "beat-this>=1.1.0",
  "beartype>=0.22.9",
  "demucs==4.0.1",
  "librosa>=0.11.0",
  "mt3-infer[torch]==0.1.3",
  "numpy>=2.0.0",
  # ONNX drum-CRNN engine (opt-in): onnxruntime runs inference in-process,
  # onnx is needed by the torch.onnx export path. onnx is pinned to 1.18.0 --
  # onnx>=1.19 requires ml-dtypes>=0.5, which conflicts with tensorflow-intel
  # 2.14 (a basic-pitch dep) hard-pinning ml-dtypes==0.2.0; 1.18.0 is the newest
  # onnx that imports cleanly against ml-dtypes 0.2.0.
  "onnx==1.18.0",
  "onnxruntime>=1.20",
  "pytorch-lightning==2.6.1",
  "scikit-learn>=1.8.0",
  "scipy>=1.17.0",
  "soundfile>=0.13.0",
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "torchcrepe>=0.0.24",
  "torchvision==0.26.0",
  "transformers==4.49.0",
  "x-transformers>=2.17.7",
]

[project.scripts]
aural_ingest = "aural_ingest.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# --cov-fail-under reflects the LIGHTWEIGHT CI runtime (requirements-dev.txt only:
# pytest + ruff + numpy). conftest.py skip-collects the ML/DSP-heavy suites that
# need librosa/torch/soundfile/basic-pitch, so the measured floor here (~28%) is
# the pure-logic coverage, not the full-runtime figure. Raise it as more deps or
# pure-logic tests land; the full suite's coverage is exercised in dev/full envs.
addopts = "--cov=src/aural_ingest --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=25"
markers = [
  "runtime_benchmark: opt-in ingest runtime benchmarks run by npm run bench:python",
]

[tool.ruff]
line-length = 100

[tool.coverage.run]
branch = true
source = ["aural_ingest"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
