[package]
name = "songpack-core"
version = "0.0.0"
edition = "2021"

# Shared SongPack contract logic used by both Tauri shells (apps/game and
# apps/desktop). Holds the manifest scan/parse, the SongPack summary types, and
# the songs-folder filesystem watcher so the two `src-tauri` crates depend on
# one implementation instead of maintaining near-verbatim copies.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

# The songs-folder watcher emits a Tauri event through an AppHandle, so the
# crate depends on tauri (no app-specific features) and notify.
tauri = { version = "2" }
notify = "6"

[dev-dependencies]
tempfile = "3"
