name: lint-test

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node/TS (host + viz plugins + shared packages)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node deps (if lockfile exists)
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No package-lock.json yet; skipping npm ci"
          fi

      - name: Transcription Recovery Guard
        run: npm run ci:verify:transcription-recovery --if-present

      - name: TS lint
        run: npm run lint --if-present

      # Build the frontends BEFORE running tests so the dist-bundle runtime
      # integration test (apps/game/tests/distBundleSongLibrary.integration
      # .test.ts) loads a freshly compiled bundle instead of silently skipping.
      # With CI=true set below, that test FAILS (not skips) if dist/ is absent.
      - name: Build AuralPrimer frontend (apps/game)
        run: npm -w @auralprimer/game run build

      - name: Build AuralStudio frontend (apps/desktop)
        run: npm -w @auralprimer/studio run build

      # Headless-browser render smoke test (apps/desktop/tests/e2e). Catches the
      # blank-screen / layout-collapse regression class that jsdom unit tests
      # cannot: the DAW editor routes mount a WebGL stage sized with flex:1, and
      # a broken CSS height-chain silently collapses it to 0px. Runs against the
      # freshly built AuralStudio dist served by vite preview (configured in the
      # root playwright.config.ts webServer). Chromium only.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: AuralStudio render smoke test (e2e)
        run: npm run test:e2e

      - name: Playback Coverage Gate (100%)
        run: npm run test:coverage:playback --if-present

      - name: AuralSong Fixture Validation Gate
        run: npm run test:auralsong-fixtures --if-present

      - name: TS tests + coverage
        # CI is provided by GitHub Actions by default; set it explicitly so the
        # dist-bundle integration test's "fail if dist/ is missing" gate is
        # active even under non-GitHub runners (e.g. act).
        env:
          CI: "true"
        run: npm run test:coverage --if-present

      - name: Frontend runtime benchmark artifact
        run: npm run bench:frontend:compare --if-present

      - name: Upload frontend benchmark artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-runtime-benchmarks
          path: benchmarks/frontend/*.json
          if-no-files-found: ignore

      # Python (ingest pipeline)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f python/ingest/requirements-dev.txt ]; then pip install -r python/ingest/requirements-dev.txt; fi

      - name: Python lint/tests
        run: |
          if [ -d python/ingest ]; then
            cd python/ingest
            if [ -f pyproject.toml ]; then
              python -m ruff check . || exit 1
              python -m pytest -q || exit 1
            fi
          fi

      # Rust (tauri backend)
      - uses: dtolnay/rust-toolchain@stable

      # Tauri v2 needs the GTK/WebKit system libraries to compile its Linux
      # backend (gio-sys/glib-sys/gobject-sys build scripts fail without them).
      # ubuntu-latest doesn't ship them, so cargo fmt/clippy/test/coverage below
      # can't build the Tauri crates until they're installed.
      - name: Install Tauri Linux system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            libasound2-dev \
            libssl-dev \
            build-essential \
            file

      # Both Tauri crates declare `externalBin: ["binaries/aural_ingest"]`, so
      # their build scripts fail at compile time ("resource path ... doesn't
      # exist") unless the sidecar binary is staged. lint-test.yml does NOT
      # build the (expensive ML) Python sidecar, so stage a zero-byte
      # placeholder with the host target triple's name. The build script only
      # checks the file exists; it isn't executed during cargo check/test/clippy.
      - name: Stage placeholder sidecar for Tauri build scripts
        shell: bash
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          for crate in apps/desktop/src-tauri apps/game/src-tauri; do
            if [ -f "$crate/Cargo.toml" ]; then
              mkdir -p "$crate/binaries"
              : > "$crate/binaries/aural_ingest-${triple}"
            fi
          done

      - name: Rust fmt/clippy/tests
        shell: bash
        run: |
          # There is no root Cargo workspace, so iterate over every Tauri crate
          # (AuralStudio = apps/desktop, AuralPrimer = apps/game). Previously
          # only apps/desktop was linted/tested, leaving the game backend
          # entirely unchecked in CI.
          crates=(apps/desktop/src-tauri apps/game/src-tauri)
          found=0
          for crate in "${crates[@]}"; do
            if [ -f "$crate/Cargo.toml" ]; then
              found=1
              echo "::group::cargo fmt/clippy/test ($crate)"
              # NOTE: no --all-features. The only non-default feature is `asio`
              # (cpal/asio), which is Windows-only and pulls the Steinberg ASIO
              # SDK; it cannot build on the ubuntu-latest runner. default = [].
              ( cd "$crate"
                cargo fmt --all -- --check
                cargo clippy --all-targets -- -D warnings
                cargo test --all )
              echo "::endgroup::"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No Rust crate yet; skipping"
          fi

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Rust coverage
        shell: bash
        run: |
          crates=(apps/desktop/src-tauri apps/game/src-tauri)
          found=0
          for crate in "${crates[@]}"; do
            if [ -f "$crate/Cargo.toml" ]; then
              found=1
              echo "::group::cargo llvm-cov ($crate)"
              # Floor reflects measured reality, not aspiration: the Tauri crates
              # are mostly IPC/command glue with focused unit tests (desktop 44% /
              # game 46% lines). 75 was never met (CI never reached this step until
              # the Linux build was fixed). 40 guards against regression; raise it
              # as real coverage improves.
              ( cd "$crate"
                mkdir -p target/coverage
                cargo llvm-cov --workspace --lcov --output-path target/coverage/lcov.info --fail-under-lines 40 )
              echo "::endgroup::"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No Rust crate yet; skipping"
          fi
